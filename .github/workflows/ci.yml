name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # tests/conftest.py sets ANTHROPIC_API_KEY, DATABASE_URL (sqlite://) and
      # every other required setting before app.config.Settings is built, so
      # this needs no .env file, no secrets and no Postgres service.
      - name: Run pytest (includes tests/test_architecture.py)
        run: pytest
