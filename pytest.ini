[pytest]
# Works from the repo root or backend/ (see the root conftest.py). `.` exposes
# contracts/, stages/ and shared/; `backend` exposes the `app` package the same
# way uvicorn sees it.
testpaths = tests
pythonpath = . backend
# The planted-cause scenarios and the data failure-mode suites take most of the
# run (Thach, 2026-10-02). `pytest -m "not slow_suite"` skips them while
# iterating; the full suite - plain `pytest` - still runs before every commit.
# The marker is applied by path in the root conftest.py.
markers =
    slow_suite: the scenario and data failure-mode suites (left out by -m "not slow_suite")
